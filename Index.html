    <style>
/* === FONDO Y ANIMACIÓN EFECTO AGUA EN TONOS GRISES === */

<body>

<script>
    /* === SISTEMA DE ALMACENAMIENTO SEGURO Y PREVENCIÓN DE PÉRDIDAS === */
    window.addEventListener('beforeunload', (e) => {
        const grabandoZona = mediaRecorder && mediaRecorder.state === 'recording';
        const grabandoGeneral = mediaRecorderGeneral && mediaRecorderGeneral.state === 'recording';
        const grabandoCompleto = mediaRecorderCompleto && mediaRecorderCompleto.state === 'recording';

        if (grabandoZona || grabandoGeneral || grabandoCompleto) {
            e.preventDefault();
            e.returnValue = '';
        }
    });

    function obtenerDB() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open('HabiRecorderDB', 2);
            req.onupgradeneeded = () => {
                const db = req.result;
                if (!db.objectStoreNames.contains('respaldos')) db.createObjectStore('respaldos');
                if (!db.objectStoreNames.contains('videos')) db.createObjectStore('videos', { keyPath: 'id' });
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
    }

    async function guardarChunkRespaldo(tipo, chunk) {
        try {
            const db = await obtenerDB();
            const tx = db.transaction('respaldos', 'readwrite');
            const store = tx.objectStore('respaldos');
            store.put({ tipo: tipo, data: chunk, timestamp: Date.now() }, `${tipo}_${Date.now()}`);
        } catch(e) {
            console.error("Error respaldando chunk:", e);
        }
    }

    async function limpiarRespaldo(tipo) {
        try {
            const db = await obtenerDB();
            const tx = db.transaction('respaldos', 'readwrite');
            const store = tx.objectStore('respaldos');
            const req = store.openCursor();
            req.onsuccess = (e) => {
                const cursor = e.target.result;
                if (cursor) {
                    if (cursor.value.tipo === tipo) store.delete(cursor.key);
                    cursor.continue();
                }
            };
        } catch(e) {}
    }

    window.addEventListener('DOMContentLoaded', async () => {
        await cargarHistorialGuardado();
        try {
            const db = await obtenerDB();
            const tx = db.transaction('respaldos', 'readonly');
            const store = tx.objectStore('respaldos');
            const req = store.getAll();

            req.onsuccess = () => {
                const items = req.result;
                if (items && items.length > 0) {
                    const agrupados = {};
                    items.forEach(it => {
                        if (!agrupados[it.tipo]) agrupados[it.tipo] = [];
                        agrupados[it.tipo].push(it.data);
                    });

                    for (const tipo in agrupados) {
                        const blob = new Blob(agrupados[tipo], { type: 'video/webm' });
                        if (blob.size > 0) {
                            descargarVideo(blob, `${tipo}_Recuperado`);
                        }
                        limpiarRespaldo(tipo);
                    }
                    alert("⚠️ Se detectaron grabaciones pendientes de una sesión anterior no cerrada y se recuperaron en la lista.");
                }
            };
        } catch (e) {}
    });

    /* === LÓGICA DE ANIMACIÓN DEL CÍRCULO === */
    const $circle = document.getElementById('animatableCircle');
    const $x = document.getElementById('coordX');
    const $y = document.getElementById('coordY');

    let targetX = window.innerWidth / 2;
    let targetY = window.innerHeight / 2;
    let currentX = targetX;
    let currentY = targetY;

    window.addEventListener('mousemove', (e) => {
        targetX = e.clientX;
        targetY = e.clientY;
    });

    function animateCircle() {
        currentX += (targetX - currentX) * 0.1;
        currentY += (targetY - currentY) * 0.1;

        if ($circle) {$circle.style.transform = `translate3d(${currentX - 30}px, ${currentY - 30}px, 0)`;
        }

        if ($x &&$y) {
            $x.textContent = currentX.toFixed(2);$y.textContent = currentY.toFixed(2);
        }

        requestAnimationFrame(animateCircle);
    }
    animateCircle();

    /* === LÓGICA DE GRABACIÓN DE PANTALLA Y VENTANA PIP === */
    let mediaRecorder = null;
    let recordedChunks = [];
    let bytesAcumuladosZona = 0;
    let screenStream = null;
    let micStream = null;
    let audioContextGlobal = null;
    let audioDestinationGlobal = null;
    let botonActivo = null;
    let zonaActual = '';

    let mediaRecorderGeneral = null;
    let chunksGeneral = [];
    let bytesAcumuladosGeneral = 0;
    const MAX_BYTES = 49 * 1024 * 1024;

    let mediaRecorderCompleto = null;
    let chunksCompleto = [];

    const btnFlotante = document.getElementById('btnFlotante');
    const btnPermisos = document.getElementById('btnPermisos');
    const btnParar = document.getElementById('btnParar');
    const btnRecorridoGeneral = document.getElementById('btnRecorridoGeneral');
    const btnVideoCompleto = document.getElementById('btnVideoCompleto');
    const btnStopCompleto = document.getElementById('btnStopCompleto');
    const listaDescargas = document.getElementById('listaDescargas');

    function manejarClicGlobal(e) {
        if (e.target.classList.contains('btn-redescargar')) {
            const url = e.target.getAttribute('data-url');
            const nombre = e.target.getAttribute('data-nombre');
            ejecutarDescarga(url, nombre);
            return;
        }

        if (e.target.classList.contains('btn-borrar')) {
            borrarVideoGuardado(e.target.getAttribute('data-id'), e.target.closest('.item-descarga'));
            return;
        }

        const btnZona = e.target.closest('.btn-zona');
        if (btnZona) {
            const nombreZona = btnZona.getAttribute('data-zona');
            iniciarGrabacionZona(nombreZona, btnZona);
            return;
        }

        if (e.target.closest('#btnPermisos')) {
            prepararPermisos();
            return;
        }

        if (e.target.closest('#btnParar')) {
            detenerGrabacionManual();
            return;
        }

        if (e.target.closest('#btnRecorridoGeneral')) {
            toggleRecorridoGeneral();
            return;
        }

        if (e.target.closest('#btnVideoCompleto')) {
            iniciarVideoCompleto();
            return;
        }

        if (e.target.closest('#btnStopCompleto')) {
            detenerVideoCompleto();
            return;
        }
    }

    document.addEventListener('click', manejarClicGlobal);

    if ('documentPictureInPicture' in window) {
        btnFlotante.addEventListener('click', async () => {
            const contenido = document.getElementById('contenidoGrabador');
            
            const pipWindow = await window.documentPictureInPicture.requestWindow({
                width: 340,
                height: 680,
            });

            [...document.styleSheets].forEach((styleSheet) => {
                try {
                    const cssTexts = [...styleSheet.cssRules].map((rule) => rule.cssText).join(' ');
                    const style = document.createElement('style');
                    style.textContent = cssTexts;
                    pipWindow.document.head.appendChild(style);
                } catch (e) {
                    const link = document.createElement('link');
                    link.rel = 'stylesheet';
                    link.href = styleSheet.href;
                    pipWindow.document.head.appendChild(link);
                }
            });

            pipWindow.document.body.classList.add('pip-window');
            pipWindow.document.body.appendChild(contenido);
            btnFlotante.style.display = 'none';

            pipWindow.document.addEventListener('click', manejarClicGlobal);

            pipWindow.addEventListener('pagehide', () => {
                document.body.appendChild(contenido);
                btnFlotante.style.display = 'block';
            });
        });
    } else {
        btnFlotante.innerText = "Ventana flotante no soportada";
        btnFlotante.disabled = true;
    }

    async function prepararPermisos() {
        try {
            if (!micStream || !micStream.active) {
                micStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { 
                        echoCancellation: true, 
                        noiseSuppression: true 
                    } 
                });
            }

            if (!screenStream || !screenStream.active) {
                screenStream = await navigator.mediaDevices.getDisplayMedia({ 
                    video: true, 
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false
                    } 
                });

                const audioTracksSistema = screenStream.getAudioTracks();
                if (audioTracksSistema.length === 0) {
                    alert("⚠️ ¡Atención! No seleccionaste compartir el audio del sistema. Al compartir la pantalla, asegúrate de marcar 'Compartir audio del sistema' y seleccionar 'Toda la pantalla'.");
                }

                screenStream.getVideoTracks()[0].onended = () => {
                    detenerGrabacionManual();
                    detenerRecorridoGeneralCompleto();
                    detenerVideoCompleto();
                    resetearBotonPermisos();
                };
            }

            if (audioContextGlobal) {
                try { await audioContextGlobal.close(); } catch(e) {}
            }

            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            audioContextGlobal = new AudioCtx();
            audioDestinationGlobal = audioContextGlobal.createMediaStreamDestination();

            if (screenStream.getAudioTracks().length > 0) {
                const sourceScreen = audioContextGlobal.createMediaStreamSource(screenStream);
                const screenGain = audioContextGlobal.createGain();
                screenGain.gain.value = 1.0;
                sourceScreen.connect(screenGain);
                screenGain.connect(audioDestinationGlobal);
            }

            if (micStream.getAudioTracks().length > 0) {
                const sourceMic = audioContextGlobal.createMediaStreamSource(micStream);
                const micGain = audioContextGlobal.createGain();
                micGain.gain.value = 1.0;
                sourceMic.connect(micGain);
                micGain.connect(audioDestinationGlobal);
            }

            if (audioContextGlobal.state === 'suspended') {
                await audioContextGlobal.resume();
            }

            btnPermisos.innerText = "✅ Permisos Conectados";
            btnPermisos.classList.add('listo');
            return true;
        } catch (err) {
            console.error("Error al obtener permisos:", err);
            alert("Error al obtener permisos de pantalla/micrófono. Asegúrate de permitir el acceso.");
            resetearBotonPermisos();
            return false;
        }
    }

    function resetearBotonPermisos() {
        btnPermisos.innerText = "🎙️ Activar Permisos y Pantalla";
        btnPermisos.classList.remove('listo');
        screenStream = null;
        micStream = null;
        if (audioContextGlobal) {
            try { audioContextGlobal.close(); } catch(e) {}
            audioContextGlobal = null;
        }
    }

    async function iniciarGrabacionZona(nombreZona, botonPresionado) {
        if (botonPresionado.classList.contains('procesando')) return;
        if (botonActivo === botonPresionado && mediaRecorder && mediaRecorder.state === 'recording') return;

        if (mediaRecorder && mediaRecorder.state === 'recording') {
            await detenerYProcesarGrabacionAnterior();
        }

        if (!micStream || !micStream.active || !screenStream || !screenStream.active || !audioContextGlobal) {
            const listo = await prepararPermisos();
            if (!listo) return;
        }

        try {
            zonaActual = nombreZona;
            recordedChunks = [];
            bytesAcumuladosZona = 0;
            limpiarRespaldo('Zona_' + zonaActual);

            const audioMezcladoTrack = audioDestinationGlobal.stream.getAudioTracks()[0];
            const videoTrack = screenStream.getVideoTracks()[0];

            const streamFinal = new MediaStream();
            streamFinal.addTrack(videoTrack);
            if (audioMezcladoTrack) {
                streamFinal.addTrack(audioMezcladoTrack);
            }

            let mimeType = 'video/webm;codecs=vp8,opus';
            if (!MediaRecorder.isTypeSupported(mimeType)) {
                mimeType = 'video/webm';
            }

            const opcionesGrabacion = {
                mimeType: mimeType,
                videoBitsPerSecond: 2500000,
                audioBitsPerSecond: 128000
            };

            mediaRecorder = new MediaRecorder(streamFinal, opcionesGrabacion);

            mediaRecorder.ondataavailable = (e) => {
                if (e.data && e.data.size > 0) {
                    recordedChunks.push(e.data);
                    bytesAcumuladosZona += e.data.size;
                    guardarChunkRespaldo('Zona_' + zonaActual, e.data);

                    // Si la zona activa es Cocina y supera el límite de 49MB, se corta y descarga
                    if (zonaActual === 'Cocina' && bytesAcumuladosZona >= MAX_BYTES) {
                        detenerGrabacionManual();
                    }
                }
            };

            mediaRecorder.start(200);
            
            botonActivo = botonPresionado;
            botonActivo.classList.remove('procesando');
            botonActivo.classList.add('grabando');
            actualizarIconoBoton(botonActivo, '⏳');

            btnParar.disabled = false;

        } catch (err) {
            console.error("Error al iniciar grabación:", err);
        }
    }

    function detenerYProcesarGrabacionAnterior() {
        return new Promise((resolve) => {
            if (!mediaRecorder || mediaRecorder.state === 'inactive') {
                resolve();
                return;
            }

            const rec = mediaRecorder;
            const chunks = recordedChunks;
            const zonaGuardar = zonaActual;
            const btn = botonActivo;

            mediaRecorder = null;
            recordedChunks = [];
            bytesAcumuladosZona = 0;
            botonActivo = null;

            if (btn) {
                btn.classList.remove('grabando');
                btn.classList.add('procesando');
                actualizarIconoBoton(btn, '⚙️️');
            }

            rec.onstop = () => {
                const blobOriginal = new Blob(chunks, { type: 'video/webm' });
                
                if (blobOriginal.size > 0) {
                    const barra = btn ? btn.querySelector('.barra-progreso') : null;
                    if (barra) barra.style.width = '100%';
                    
                    descargarVideo(blobOriginal, zonaGuardar);
                    limpiarRespaldo('Zona_' + zonaGuardar);
                }

                if (btn) {
                    setTimeout(() => {
                        btn.classList.remove('procesando');
                        const barra = btn.querySelector('.barra-progreso');
                        if (barra) barra.style.width = '0%';
                        actualizarIconoBoton(btn, '🔴');
                    }, 400);
                }
                resolve();
            };

            rec.stop();
        });
    }

    async function detenerGrabacionManual() {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
            await detenerYProcesarGrabacionAnterior();
            btnParar.disabled = true;
        }
    }

    async function toggleRecorridoGeneral() {
        if (mediaRecorderGeneral && mediaRecorderGeneral.state === 'recording') {
            detenerRecorridoGeneralCompleto();
        } else {
            if (!micStream || !micStream.active || !screenStream || !screenStream.active || !audioContextGlobal) {
                const listo = await prepararPermisos();
                if (!listo) return;
            }

            try {
                chunksGeneral = [];
                bytesAcumuladosGeneral = 0;
                limpiarRespaldo('Recorrido_General');

                const audioMezcladoTrack = audioDestinationGlobal.stream.getAudioTracks()[0];
                const videoTrack = screenStream.getVideoTracks()[0];

                const streamFinal = new MediaStream();
                streamFinal.addTrack(videoTrack);
                if (audioMezcladoTrack) {
                    streamFinal.addTrack(audioMezcladoTrack);
                }

                let mimeType = 'video/webm;codecs=vp8,opus';
                if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm';

                mediaRecorderGeneral = new MediaRecorder(streamFinal, {
                    mimeType: mimeType,
                    videoBitsPerSecond: 2500000,
                    audioBitsPerSecond: 128000
                });

                mediaRecorderGeneral.ondataavailable = (e) => {
                    if (e.data && e.data.size > 0) {
                        chunksGeneral.push(e.data);
                        bytesAcumuladosGeneral += e.data.size;
                        guardarChunkRespaldo('Recorrido_General', e.data);

                        if (bytesAcumuladosGeneral >= MAX_BYTES) {
                            detenerRecorridoGeneralCompleto();
                        }
                    }
                };

                mediaRecorderGeneral.start(200);

                btnRecorridoGeneral.innerText = "⏹️ Detener Recorrido General";
                btnRecorridoGeneral.classList.add('grabando');

            } catch (err) {
                console.error("Error al iniciar Recorrido General:", err);
            }
        }
    }

    function detenerRecorridoGeneralCompleto() {
        if (!mediaRecorderGeneral) return;

        const rec = mediaRecorderGeneral;
        const chunks = chunksGeneral;
        mediaRecorderGeneral = null;

        rec.onstop = () => {
            const blobGeneral = new Blob(chunks, { type: 'video/webm' });
            if (blobGeneral.size > 0) {
                descargarVideo(blobGeneral, 'Recorrido_General');
                limpiarRespaldo('Recorrido_General');
            }
        };

        if (rec.state !== 'inactive') {
            rec.stop();
        }

        btnRecorridoGeneral.innerText = "📹 Iniciar Recorrido General";
        btnRecorridoGeneral.classList.remove('grabando');
    }

    async function iniciarVideoCompleto() {
        if (mediaRecorderCompleto && mediaRecorderCompleto.state === 'recording') return;

        if (!micStream || !micStream.active || !screenStream || !screenStream.active || !audioContextGlobal) {
            const listo = await prepararPermisos();
            if (!listo) return;
        }

        try {
            chunksCompleto = [];
            limpiarRespaldo('Video_Completo');

            const audioMezcladoTrack = audioDestinationGlobal.stream.getAudioTracks()[0];
            const videoTrack = screenStream.getVideoTracks()[0];

            const streamFinal = new MediaStream();
            streamFinal.addTrack(videoTrack);
            if (audioMezcladoTrack) {
                streamFinal.addTrack(audioMezcladoTrack);
            }

            let mimeType = 'video/webm;codecs=vp8,opus';
            if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm';

            mediaRecorderCompleto = new MediaRecorder(streamFinal, {
                mimeType: mimeType,
                videoBitsPerSecond: 2500000,
                audioBitsPerSecond: 128000
            });

            mediaRecorderCompleto.ondataavailable = (e) => {
                if (e.data && e.data.size > 0) {
                    chunksCompleto.push(e.data);
                    guardarChunkRespaldo('Video_Completo', e.data);
                }
            };

            mediaRecorderCompleto.start(1000);

            btnVideoCompleto.innerText = "🔴 Grabando Video Completo";
            btnVideoCompleto.classList.add('grabando');
            btnStopCompleto.disabled = false;

        } catch (err) {
            console.error("Error al iniciar Video Completo:", err);
        }
    }

    function detenerVideoCompleto() {
        if (!mediaRecorderCompleto) return;

        const rec = mediaRecorderCompleto;
        const chunks = chunksCompleto;
        mediaRecorderCompleto = null;

        rec.onstop = () => {
            const blobCompleto = new Blob(chunks, { type: 'video/webm' });
            if (blobCompleto.size > 0) {
                descargarVideo(blobCompleto, 'Video_Completo');
                limpiarRespaldo('Video_Completo');
            }
        };

        if (rec.state !== 'inactive') {
            rec.stop();
        }

        btnVideoCompleto.innerText = "🎥 Iniciar Video Completo";
        btnVideoCompleto.classList.remove('grabando');
        btnStopCompleto.disabled = true;
    }

    function actualizarIconoBoton(boton, icono) {
        if (!boton) return;
        const span = boton.querySelector('span');
        if (span) {
            span.textContent = icono;
        }
    }

    /* === HISTORIAL PERSISTENTE (sobrevive a cerrar o recargar la pestaña) === */
    const MAX_VIDEOS_GUARDADOS = 100;

    function textoHora(ts) {
        const d = new Date(ts);
        const hora = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        return d.toDateString() === new Date().toDateString()
            ? hora
            : d.toLocaleDateString([], { day: '2-digit', month: '2-digit' }) + ' ' + hora;
    }

    function agregarItemHistorial(reg, alFinal) {
        const url = URL.createObjectURL(reg.blob);
        const item = document.createElement('div');
        item.className = 'item-descarga';
        item.setAttribute('data-id', reg.id);
        item.innerHTML = `
            <span>📹 <strong>${reg.nombreZona}</strong> (${textoHora(reg.timestamp)})</span>
            <span class="acciones-item">
                <button class="btn-redescargar" data-url="${url}" data-nombre="${reg.nombreArchivo}">⬇️ Descargar</button>
                <button class="btn-borrar" data-id="${reg.id}" title="Quitar de la lista">🗑️</button>
            </span>
        `;
        if (alFinal) listaDescargas.appendChild(item); else listaDescargas.prepend(item);
        return url;
    }

    async function guardarVideoTerminado(reg) {
        try {
            const db = await obtenerDB();
            await new Promise((resolve, reject) => {
                const tx = db.transaction('videos', 'readwrite');
                tx.objectStore('videos').put(reg);
                tx.oncomplete = resolve;
                tx.onerror = () => reject(tx.error);
            });
            await podarVideosViejos();
        } catch (e) {
            console.error('No se pudo guardar el video en el historial:', e);
        }
    }

    async function listarVideosGuardados() {
        const db = await obtenerDB();
        return new Promise((resolve, reject) => {
            const req = db.transaction('videos', 'readonly').objectStore('videos').getAll();
            req.onsuccess = () => resolve((req.result || []).sort((a, b) => b.timestamp - a.timestamp));
            req.onerror = () => reject(req.error);
        });
    }

    async function podarVideosViejos() {
        const todos = await listarVideosGuardados();
        if (todos.length <= MAX_VIDEOS_GUARDADOS) return;
        const db = await obtenerDB();
        const tx = db.transaction('videos', 'readwrite');
        todos.slice(MAX_VIDEOS_GUARDADOS).forEach(v => tx.objectStore('videos').delete(v.id));
        document.querySelectorAll('#listaDescargas .item-descarga').forEach(el => {
            if (todos.slice(MAX_VIDEOS_GUARDADOS).some(v => v.id === el.getAttribute('data-id'))) el.remove();
        });
    }

    async function borrarVideoGuardado(id, elemento) {
        try {
            const db = await obtenerDB();
            db.transaction('videos', 'readwrite').objectStore('videos').delete(id);
        } catch (e) {}
        if (elemento) elemento.remove();
    }

    async function cargarHistorialGuardado() {
        try {
            const videos = await listarVideosGuardados();
            videos.forEach(v => agregarItemHistorial(v, true));
        } catch (e) {
            console.error('No se pudo leer el historial guardado:', e);
        }
    }

    function descargarVideo(blob, nombreZona) {
        const nombreArchivo = `${nombreZona}.webm`;
        const reg = {
            id: 'v_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
            nombreZona: nombreZona,
            nombreArchivo: nombreArchivo,
            blob: blob,
            timestamp: Date.now()
        };
        const url = agregarItemHistorial(reg, false);
        ejecutarDescarga(url, nombreArchivo);
        guardarVideoTerminado(reg);
    }

    function ejecutarDescarga(url, nombreArchivo) {
        const a = document.createElement('a');
        a.href = url;
        a.download = nombreArchivo;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }
</script>
